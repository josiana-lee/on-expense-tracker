<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#7B87F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Brand assets are generated — see scripts/brand.mjs, `pnpm brand`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Kept in step with APP_INFO.appName in src/data/appInfo.ts by hand;
         plain HTML can't read the module. -->
    <title>온:On 지출 가계부</title>
    <!-- Bundled, not from a CDN. The app ships as a package and its whole
         premise is that nothing needs a network: a CDN font meant the design
         collapsed to a system fallback whenever the phone was offline, which
         for something used while out and about is most of the time it
         matters. It also put an outbound request on every launch, which sits
         badly with a privacy policy promising nothing leaves the device.

         Dynamic subset: 92 slices keyed by unicode-range, so only the few
         covering the characters actually on screen are read. -->
    <link rel="stylesheet" href="/fonts/pretendard.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
